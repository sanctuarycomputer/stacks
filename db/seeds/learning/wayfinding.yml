        title: "Link your payment profile (QuickBooks Bill Pay or Deel)"
        auto_check_key: payment_profile
        notion_url: "https://app.notion.com/p/225131fea2c78007ad7ef57b41c7a60f"
    questions: []

  - slug: "your-accounts"
    name: "Your accounts"
    summary: "Get into the software we use every day. Use **Login with Google** with your company email address; if you get stuck, email `admin@garden3d.net`."
    notion_url: "https://app.notion.com/p/2352c13ed1754e9db815dc964e32cd06"
    badge: null
    steps:
