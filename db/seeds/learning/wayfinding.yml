qualification:
  name: "Onboarded to garden3d"
  description: "Has signed the GCA, set up payment and core accounts, and read how garden3d pays, communicates and expects people to behave."
course:
  name: "Wayfinding"
  slug: "wayfinding"
  learner_title: "Getting on board at garden3d"
  description: "Everything you need to get set up, get paid and find your way around garden3d. Work through it in your first two weeks."
  grace_period_days: 14
modules:
  - slug: "paperwork-and-payment"
    name: "Paperwork and payment"
